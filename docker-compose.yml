version: '3.8'

services:

  # Couchbase
  couchbase:
    image: couchbase:community-7.1.1
    container_name: couchbase-smartorder
    ports:
      - "8091-8096:8091-8096"
      - "11210:11210"
    networks:
      - smartorder-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/ui/index.html"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kafka
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-smartorder
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - smartorder-network

  # Redpanda Console (Kafka UI)
  kafka-ui:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    ports:
      - "8090:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - smartorder-network

  # SmartOrder Backend
  smartorder-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartorder-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_COUCHBASE_CONNECTION_STRING: couchbase
      SPRING_COUCHBASE_USERNAME: Administrator
      SPRING_COUCHBASE_PASSWORD: Admin@1234
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - couchbase
      - kafka
    networks:
      - smartorder-network

networks:
  smartorder-network:
    driver: bridge